              - paragraph [ref=f6e193]: 3 customers · Live
              - paragraph [ref=f6e194]: Abacus turns spreadsheet chaos into a real-time command center for MCA operators — deals, underwriting, collections, syndication, and compliance in one place. Operators upload a sheet to get an instant dashboard, then graduate to live bank connections and AI-assisted underwriting. I lead product and engineering, building it as a Turborepo monorepo with a tRPC API on Postgres.
