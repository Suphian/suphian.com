  <title id="compact-logo-title">SUPH — inflated red lettering</title>
  <desc id="compact-logo-description">Editable cubic paths traced from the provided Suphian concept image. Each character is a separate named group, including the two-part dotted I. Raster contour fitting and procedural surface grain are approximations. Transparent background.</desc>
  <metadata>Source-derived vector tracing; no fonts or embedded raster images.</metadata>
