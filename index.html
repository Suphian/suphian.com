<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Metadata, structured data and the readable profile are generated from src/content.js by Vite. -->
    <!-- seo:head -->
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-suph.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="author" href="/humans.txt" />
    <link rel="llms" type="text/plain" href="/llms.txt" />

    <!-- PP Neue Montreal (src/fonts.css, public/fonts): preload the Regular face the first paint uses. -->
    <link rel="preload" href="/fonts/PPNeueMontreal-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Third-party origins. -->
    <link rel="dns-prefetch" href="//www.googletagmanager.com" />
    <link rel="dns-prefetch" href="//www.google-analytics.com" />
    <link rel="dns-prefetch" href="//ujughujunixnwlmtdsxd.supabase.co" />

    <script>
      // GA4 (gtag.js), deferred until the first interaction or 3s after load.
      // Production hostnames only: local and preview builds never load it.
      (function () {
        if (!/^(www\.)?suphian\.com$/.test(window.location.hostname)) return;
        var loaded = false;
        function loadAnalytics() {
          if (loaded) return;
          loaded = true;
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-8S5FL37K8X';
          document.head.appendChild(script);
          window.dataLayer = window.dataLayer || [];
          // On window so web-vitals reporting (src/lib/webVitals.js) can find it.
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-8S5FL37K8X');
        }
        ['mousedown', 'touchstart', 'keydown', 'scroll'].forEach(function (type) {
          document.addEventListener(type, loadAnalytics, { once: true, passive: true });
        });
        window.addEventListener('load', function () {
          setTimeout(loadAnalytics, 3000);
        });
      })();
    </script>
    <style>
      .static-profile { max-width: 860px; margin: 0 auto; padding: 48px 24px; color: #fff; background: #080808; font: 18px/1.65 'PP Neue Montreal', Arial, sans-serif; }
      .static-profile header, .static-profile article, .static-profile footer { margin-bottom: 40px; }
      .static-profile h1 { font-size: clamp(36px, 8vw, 72px); line-height: 1.1; margin: 0 0 20px; }
      .static-profile h2 { font-size: 30px; line-height: 1.2; margin: 40px 0 20px; }
      .static-profile h3 { font-size: 24px; margin: 24px 0 12px; }
      .static-profile p { margin: 12px 0; }
      .static-profile a { color: #ff746e; text-decoration: underline; }
      html[data-enhancing] .static-profile { display: none; }
    </style>
    <script>
      // A load or reload opens at the top, where the wordmark starts (Suphian
      // 2026-09-27: reloads put him back at SAY HELLO). Set before the body
      // parses, so the browser never restores against the static profile either.
      // A /#section link still opens there (App.jsx).
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      document.documentElement.setAttribute('data-enhancing', '');
      setTimeout(function () { document.documentElement.removeAttribute('data-enhancing'); }, 2000);
    </script>
  </head>
  <body>
    <div id="root"><!-- seo:profile --></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
